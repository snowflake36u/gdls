[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdls"
version = "0.4.1"
description = "Google Drive listing CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"google-api-python-client",
	"google-auth-oauthlib",
	"tqdm",
	"progress-reporter @ git+https://github.com/snowflake36u/progress-reporter.git@main",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
]

[project.scripts]
gdls = "gdls.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.semantic_release]
version_variables = [
	"src/gdls/__init__.py:__version__", # __main__.py内のバージョン変数を更新
]
version_toml = [
	"pyproject.toml:project.version", # pyproject.toml内のバージョンを更新
]
branch = "main"                             # 対象ブランチ
build_command = ""
allow_zero_version = true
major_on_zero = false
